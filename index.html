<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator">
    <div class="display" id="display">0</div>

    <label class="mode-toggle">
      <input type="checkbox" id="programmer-toggle" />
      Programmer Mode
    </label>

    <label class="mode-toggle">
      <input type="checkbox" id="statistics-toggle" />
      Statistics Mode
    </label>

    <div class="base-selector" id="base-selector" hidden>
      <button class="key key-base" data-base="10">DEC</button>
      <button class="key key-base" data-base="16">HEX</button>
      <button class="key key-base" data-base="8">OCT</button>
      <button class="key key-base" data-base="2">BIN</button>
    </div>

    <div class="hex-keys" id="hex-keys" hidden>
      <button class="key" data-digit="A">A</button>
      <button class="key" data-digit="B">B</button>
      <button class="key" data-digit="C">C</button>
      <button class="key" data-digit="D">D</button>
      <button class="key" data-digit="E">E</button>
      <button class="key" data-digit="F">F</button>
    </div>

    <div class="stats-panel" id="stats-panel" hidden>
      <div class="stats-buttons">
        <button class="key" id="stats-add">Add</button>
        <button class="key" id="stats-sum">Sum</button>
        <button class="key" id="stats-avg">Avg</button>
        <button class="key" id="stats-stddev">Std Dev</button>
        <button class="key" id="stats-clear-data">Clear Data</button>
      </div>
      <div class="data-list" id="data-list"></div>
    </div>

    <div class="keys">
      <button class="key" data-operator="÷">÷</button>
      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>

      <button class="key" data-operator="×">×</button>
      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>

      <button class="key" data-operator="-">-</button>
      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>

      <button class="key" data-operator="+">+</button>
      <button class="key" data-digit="0">0</button>
      <button class="key" id="decimal">.</button>
      <button class="key" id="clear">C</button>

      <button class="key key-equals" id="equals">=</button>
    </div>
  </main>
  <script type="module" src="calculator.js"></script>
</body>
</html>
