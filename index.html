<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator">
    <div class="display" id="display">0</div>
    <div class="mode-toggle">
      <button class="key mode-key" data-base="DEC">DEC</button>
      <button class="key mode-key" data-base="HEX">HEX</button>
      <button class="key mode-key" data-base="OCT">OCT</button>
      <button class="key mode-key" data-base="BIN">BIN</button>
    </div>
    <div class="stat-toggle">
      <button class="key mode-key" id="stat-toggle">STAT</button>
      <div class="stat-count" id="stat-count">n=0</div>
    </div>
    <div class="stat-keys">
      <button class="key" id="stat-add">Add</button>
      <button class="key" id="stat-sum">Sum</button>
      <button class="key" id="stat-avg">Avg</button>
      <button class="key" id="stat-std">Std</button>
    </div>
    <div class="keys">
      <button class="key" data-digit="A">A</button>
      <button class="key" data-digit="B">B</button>
      <button class="key" data-digit="C">C</button>
      <button class="key" data-digit="D">D</button>
      <button class="key" data-digit="E">E</button>
      <button class="key" data-digit="F">F</button>

      <button class="key" data-operator="÷">÷</button>
      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>

      <button class="key" data-operator="×">×</button>
      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>

      <button class="key" data-operator="-">-</button>
      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>

      <button class="key" data-operator="+">+</button>
      <button class="key" data-digit="0">0</button>
      <button class="key" id="decimal">.</button>
      <button class="key" id="clear">C</button>

      <button class="key key-equals" id="equals">=</button>
    </div>
  </main>
  <script type="module" src="calculator.js"></script>
</body>
</html>
